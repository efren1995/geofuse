name: Build GeoFuse APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Write android/local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --no-daemon || true
            fi
            if [ -x "./gradlew" ]; then
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              gradle assembleDebug --no-daemon --stacktrace
            fi
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk geofuse-debug.apk

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: geofuse-debug.apk
