name: Build GeoFuse APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Write android/local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          APK_DIR="android/app/build/outputs/apk/debug"
          APK_SRC="${APK_DIR}/app-debug.apk"
          if [ ! -s "$APK_SRC" ]; then
            APK_SRC="$(find "$APK_DIR" -maxdepth 2 -type f -name '*.apk' -size +0c 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "ERROR: No non-empty debug APK found under $APK_DIR"
            ls -laR android/app/build/outputs/ 2>/dev/null || true
            exit 1
          fi
          echo "Found debug APK at: $APK_SRC ($(wc -c < "$APK_SRC") bytes)"
          cp -f "$APK_SRC" geofuse-debug.apk
          ls -lh geofuse-debug.apk

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: geofuse-debug.apk
