<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOFUSE // Unified Fusion Workbench</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #080d14;
      --panel: #101824;
      --border: #1e2d42;
      --text: #e6edf3;
      --muted: #8b9bb4;
      --accent: #00f5d4;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: 52px 1fr;
      height: 100vh;
    }
    header {
      grid-column: 1 / -1;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      background: #132235;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 11px;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #0b111a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .card h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
    input, select, button {
      width: 100%;
      margin-top: 4px;
      padding: 7px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #101926;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
    }
    button {
      background: #0d3b38;
      border-color: var(--accent);
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #12524d; }
    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }
    main {
      display: grid;
      grid-template-rows: 1.2fr 1fr;
      overflow: hidden;
    }
    #map { width: 100%; height: 100%; min-height: 240px; }
    .stage {
      display: grid;
      grid-template-columns: 1fr 320px;
      border-top: 1px solid var(--border);
      background: #070b10;
      min-height: 0;
    }
    .video-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #04070b;
    }
    video, canvas#overlay {
      max-width: 100%;
      max-height: 100%;
    }
    canvas#overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #telemetryLog {
      border-left: 1px solid var(--border);
      padding: 8px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.45;
    }
    .log-item { border-bottom: 1px solid #152030; padding: 4px 0; }
    pre {
      margin: 6px 0 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 11px;
      color: #b8c7dc;
      max-height: 140px;
      overflow-y: auto;
    }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr; height: auto; min-height: 100vh; }
      aside { max-height: 55vh; border-right: none; border-bottom: 1px solid var(--border); }
      main { grid-template-rows: 300px auto; }
      .stage { grid-template-columns: 1fr; }
      #telemetryLog { border-left: none; border-top: 1px solid var(--border); max-height: 200px; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>GEOFUSE</strong> // OSM · NASA · GeoIP · GeoCLIP · YOLOv8</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="activeCamBadge" class="badge">CAM: cam_01</span>
      <span id="apiBadge" class="badge">API: CHECKING</span>
      <span id="wsBadge" class="badge">WS: DISCONNECTED</span>
    </div>
  </header>

  <aside>
    <div class="card">
      <h3>1. Live Stream &amp; YOLOv8</h3>
      <div class="row">
        <div>
          <label>Camera ID</label>
          <select id="cameraSelect">
            <option value="cam_01">cam_01</option>
            <option value="cam_02">cam_02</option>
            <option value="cam_03">cam_03</option>
            <option value="cam_04">cam_04</option>
            <option value="cam_05">cam_05</option>
            <option value="cam_06">cam_06</option>
          </select>
        </div>
        <div>
          <label>Stream Source</label>
          <select id="streamMode">
            <option value="whep">MediaMTX WebRTC (WHEP)</option>
            <option value="webcam">Device Camera (getUserMedia)</option>
            <option value="direct_url">Direct Stream URL (HLS/HTTP)</option>
          </select>
        </div>
      </div>
      <label>Stream / WHEP URL</label>
      <input id="whepUrl" value="http://127.0.0.1:8889/cam_01/whep" />
      <div class="row">
        <button id="btnStartStream">Start Feed</button>
        <button id="btnToggleYolo">YOLO: OFF</button>
      </div>
      <label>Confidence / ImgSz</label>
      <div class="row">
        <input id="yoloConf" type="number" step="0.05" min="0.05" max="0.95" value="0.35" />
        <input id="yoloImgsz" type="number" step="32" min="256" max="1280" value="416" />
      </div>
    </div>

    <div class="card">
      <h3>2. GeoCLIP Visual Geolocation</h3>
      <input id="geoclipFile" type="file" accept="image/*" />
      <button id="btnRunGeoClip">Predict GPS Coordinates</button>
      <pre id="geoclipOut">No GeoCLIP run yet.</pre>
    </div>

    <div class="card">
      <h3>3. MaxMind GeoIP Lookup</h3>
      <input id="ipInput" placeholder="8.8.8.8" value="8.8.8.8" />
      <button id="btnRunGeoIp">Lookup IP</button>
      <pre id="geoipOut">No IP lookup yet.</pre>
    </div>

    <div class="card">
      <h3>4. OSM &amp; NASA Earth Observatory</h3>
      <div class="row">
        <input id="osmQuery" placeholder="Search place (OSM)" value="San Luis Potosi" />
        <button id="btnOsmSearch">Go</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <button id="btnEonet">NASA EONET</button>
        <button id="btnGibs">GIBS Sat</button>
        <button id="btnClearMap">Clear Pins</button>
      </div>
      <pre id="geoOut">Ready.</pre>
    </div>
  </aside>

  <main>
    <div id="map"></div>
    <div class="stage">
      <div class="video-wrap">
        <video id="videoEl" autoplay playsinline muted crossorigin="anonymous"></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="telemetryLog"><strong>Live Telemetry Bus</strong></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = window.location.origin.startsWith("http") ? window.location.origin : "http://127.0.0.1:8000";
    const WS_URL = API_BASE.replace(/^http/, "ws") + "/ws/telemetry";

    const map = L.map("map").setView([22.1565, -100.9855], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let gibsLayer = null;
    const markers = L.layerGroup().addTo(map);
    const cameraMarkers = new Map();

    function getActiveCameraId() {
      return document.getElementById("cameraSelect").value;
    }

    function syncCameraBadgeAndUrl() {
      const camId = getActiveCameraId();
      document.getElementById("activeCamBadge").textContent = `CAM: ${camId}`;
      if (document.getElementById("streamMode").value === "whep") {
        document.getElementById("whepUrl").value = `http://127.0.0.1:8889/${camId}/whep`;
      }
    }

    document.getElementById("cameraSelect").addEventListener("change", () => {
      syncCameraBadgeAndUrl();
      addLog("CAM", `Switched active camera to ${getActiveCameraId()}`);
    });

    function addLog(tag, text) {
      const box = document.getElementById("telemetryLog");
      const el = document.createElement("div");
      el.className = "log-item";
      el.textContent = `[${new Date().toLocaleTimeString()}] ${tag}: ${text}`;
      box.prepend(el);
    }

    function pinMap(lat, lon, label) {
      if (typeof lat !== "number" || typeof lon !== "number") return;
      L.circleMarker([lat, lon], { radius: 8, color: "#00f5d4", fillOpacity: 0.65 })
        .bindPopup(label)
        .addTo(markers);
      map.panTo([lat, lon]);
    }

    function upsertCameraDetectionMarker(data) {
      const camId = data.sensor_id || "cam_01";
      const lat = Number(data.lat);
      const lon = Number(data.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || (lat === 0 && lon === 0)) return;

      const detList = Array.isArray(data.detections) ? data.detections : [];
      const summary = detList.length
        ? detList.map((d) => `${d.label} (${Math.round((d.conf || 0) * 100)}%)`).join(", ")
        : "No objects";
      const inferTag = data.infer_ms != null ? ` · ${data.infer_ms}ms` : "";
      const popupHtml = `<strong>${camId}</strong> (${lat.toFixed(4)}, ${lon.toFixed(4)})${inferTag}<br/>${summary}`;

      if (cameraMarkers.has(camId)) {
        const marker = cameraMarkers.get(camId);
        marker.setLatLng([lat, lon]).setPopupContent(popupHtml).setStyle({
          radius: Math.min(16, 8 + detList.length * 1.5),
          color: "#ffd166",
          fillColor: "#ffd166",
          fillOpacity: 0.75
        });
      } else {
        const marker = L.circleMarker([lat, lon], {
          radius: Math.min(16, 8 + detList.length * 1.5),
          color: "#ffd166",
          fillColor: "#ffd166",
          fillOpacity: 0.75
        }).bindPopup(popupHtml).addTo(markers);
        cameraMarkers.set(camId, marker);
      }

      if (camId === getActiveCameraId()) {
        map.panTo([lat, lon], { animate: true });
      }
    }

    async function checkHealth() {
      const badge = document.getElementById("apiBadge");
      try {
        const r = await fetch(`${API_BASE}/api/health`);
        const d = await r.json();
        badge.textContent = `API: OK (Y:${d.yolo_loaded ? 1 : 0} G:${d.geoclip_loaded ? 1 : 0} MM:${d.maxmind_loaded ? 1 : 0})`;
      } catch {
        badge.textContent = "API: OFFLINE";
      }
    }

    function connectWs() {
      const wsBadge = document.getElementById("wsBadge");
      const ws = new WebSocket(WS_URL);
      ws.onopen = () => { wsBadge.textContent = "WS: LIVE"; addLog("WS", "Connected"); };
      ws.onclose = () => { wsBadge.textContent = "WS: RETRY"; setTimeout(connectWs, 2000); };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "YOLO_DETECTION" && msg.data) {
          upsertCameraDetectionMarker(msg.data);
        }
        addLog(msg.type, JSON.stringify(msg.data));
      };
    }

    let pc = null;
    function stopCurrentMedia() {
      const video = document.getElementById("videoEl");
      if (pc) { pc.close(); pc = null; }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach((t) => t.stop());
        video.srcObject = null;
      }
      video.removeAttribute("src");
    }

    async function startStream() {
      const mode = document.getElementById("streamMode").value;
      const camId = getActiveCameraId();
      const video = document.getElementById("videoEl");
      stopCurrentMedia();

      if (mode === "webcam") {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        await video.play();
        addLog("STREAM", `Webcam active on ${camId}`);
      } else if (mode === "direct_url") {
        const url = document.getElementById("whepUrl").value.trim();
        video.src = url;
        await video.play();
        addLog("STREAM", `Direct URL loaded (${camId})`);
      } else {
        const whepUrl = document.getElementById("whepUrl").value.trim();
        pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        pc.addTransceiver("video", { direction: "recvonly" });
        pc.ontrack = (e) => { video.srcObject = e.streams[0]; video.play().catch(() => {}); };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        const res = await fetch(whepUrl, { method: "POST", headers: { "Content-Type": "application/sdp" }, body: offer.sdp });
        if (!res.ok) throw new Error(`WHEP HTTP ${res.status}`);
        const ans = await res.text();
        await pc.setRemoteDescription({ type: "answer", sdp: ans });
        addLog("STREAM", `WHEP connected (${camId})`);
      }
    }

    let yoloActive = false;
    let yoloBusy = false;
    const grabCanvas = document.createElement("canvas");

    async function yoloTick() {
      if (!yoloActive) return;
      const video = document.getElementById("videoEl");
      const overlay = document.getElementById("overlay");
      const ctx = overlay.getContext("2d");

      if (!yoloBusy && video.readyState >= 2 && video.videoWidth > 0) {
        yoloBusy = true;
        try {
          const camId = getActiveCameraId();
          const imgsz = parseInt(document.getElementById("yoloImgsz").value || "416", 10);
          const conf = parseFloat(document.getElementById("yoloConf").value || "0.35");
          grabCanvas.width = imgsz;
          grabCanvas.height = imgsz;
          grabCanvas.getContext("2d").drawImage(video, 0, 0, imgsz, imgsz);
          const blob = await new Promise((resolve) => grabCanvas.toBlob(resolve, "image/jpeg", 0.75));

          const form = new FormData();
          form.append("frame", blob, "frame.jpg");
          form.append("sensor_id", camId);
          form.append("conf", String(conf));
          form.append("imgsz", String(imgsz));

          const res = await fetch(`${API_BASE}/api/detect`, { method: "POST", body: form });
          const data = await res.json();

          overlay.width = video.clientWidth || 640;
          overlay.height = video.clientHeight || 360;
          ctx.clearRect(0, 0, overlay.width, overlay.height);
          const sx = overlay.width / imgsz;
          const sy = overlay.height / imgsz;
          ctx.strokeStyle = "#00f5d4";
          ctx.fillStyle = "#00f5d4";
          ctx.lineWidth = 2;
          ctx.font = "12px monospace";

          for (const d of (data.detections || [])) {
            const [x1, y1, x2, y2] = d.bbox;
            ctx.strokeRect(x1 * sx, y1 * sy, (x2 - x1) * sx, (y2 - y1) * sy);
            ctx.fillText(`[${camId}] ${d.label} ${(d.conf * 100).toFixed(0)}%`, x1 * sx + 4, Math.max(14, y1 * sy - 4));
          }
        } catch (err) {
          addLog("YOLO_ERR", err.message);
        } finally {
          yoloBusy = false;
        }
      }
      setTimeout(yoloTick, 120);
    }

    document.getElementById("btnStartStream").onclick = () => startStream().catch((e) => addLog("STREAM_ERR", e.message));
    document.getElementById("btnToggleYolo").onclick = (e) => {
      yoloActive = !yoloActive;
      e.target.textContent = yoloActive ? "YOLO: ON" : "YOLO: OFF";
      if (yoloActive) yoloTick();
    };

    document.getElementById("btnRunGeoClip").onclick = async () => {
      const file = document.getElementById("geoclipFile").files[0];
      if (!file) return;
      const form = new FormData();
      form.append("image", file);
      form.append("top_k", "5");
      const res = await fetch(`${API_BASE}/api/geoclip`, { method: "POST", body: form });
      const data = await res.json();
      document.getElementById("geoclipOut").textContent = JSON.stringify(data, null, 2);
      if (data.predictions && data.predictions[0]) {
        const p = data.predictions[0];
        pinMap(p.lat, p.lon, `GeoCLIP #1 (${(p.probability * 100).toFixed(1)}%)`);
      }
    };

    document.getElementById("btnRunGeoIp").onclick = async () => {
      const ip = document.getElementById("ipInput").value.trim();
      const res = await fetch(`${API_BASE}/api/geoip?ip=${encodeURIComponent(ip)}`);
      const data = await res.json();
      document.getElementById("geoipOut").textContent = JSON.stringify(data, null, 2);
      pinMap(data.lat, data.lon, `GeoIP: ${ip} (${data.city || ""})`);
    };

    document.getElementById("btnOsmSearch").onclick = async () => {
      const q = document.getElementById("osmQuery").value.trim();
      const res = await fetch(`${API_BASE}/api/osm/search?q=${encodeURIComponent(q)}&limit=3`);
      const data = await res.json();
      document.getElementById("geoOut").textContent = JSON.stringify(data.slice(0, 2), null, 2);
      if (data[0]) pinMap(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
    };

    document.getElementById("btnEonet").onclick = async () => {
      const res = await fetch(`${API_BASE}/api/nasa/eonet?days=7&limit=20`);
      const data = await res.json();
      let count = 0;
      for (const ev of (data.events || [])) {
        const geom = ev.geometry && ev.geometry[ev.geometry.length - 1];
        if (geom && Array.isArray(geom.coordinates) && geom.coordinates.length >= 2) {
          const [lon, lat] = geom.coordinates;
          pinMap(lat, lon, `EONET: ${ev.title}`);
          count++;
        }
      }
      document.getElementById("geoOut").textContent = `Plotted ${count} active EONET events.`;
    };

    document.getElementById("btnGibs").onclick = () => {
      if (gibsLayer) {
        map.removeLayer(gibsLayer);
        gibsLayer = null;
        addLog("GIBS", "Satellite layer hidden");
      } else {
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        gibsLayer = L.tileLayer(
          `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${yesterday}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
          { opacity: 0.7, maxZoom: 9 }
        ).addTo(map);
        addLog("GIBS", `Loaded MODIS Terra (${yesterday})`);
      }
    };

    document.getElementById("btnClearMap").onclick = () => {
      markers.clearLayers();
      cameraMarkers.clear();
      addLog("MAP", "Cleared all map markers");
    };

    syncCameraBadgeAndUrl();
    checkHealth();
    connectWs();
  </script>
</body>
</html>
